server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: growth-backend
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:growth}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
    username: ${MYSQL_USER:growth_app}
    password: ${MYSQL_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration
  task:
    scheduling:
      # 六个 @Scheduled 任务共用调度线程池，默认只有一根线程。夜间的小镇传播 job 会
      # 调 LLM，网关慢的时候它一卡就把 outbox 发布（每 5s）和排期过期（每 60s）一起
      # 饿死。给够线程，让慢任务只慢它自己。
      pool:
        size: 4
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        boot:
          allow_jdbc_metadata_access: false
        dialect: org.hibernate.dialect.MySQLDialect

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  admin:
    local-login:
      enabled: ${LOCAL_ADMIN_LOGIN_ENABLED:false}
      username: ${LOCAL_ADMIN_LOGIN_USERNAME:}
      password: ${LOCAL_ADMIN_LOGIN_PASSWORD:}
    bootstrap:
      email: ${ADMIN_BOOTSTRAP_EMAIL:}
      password: ${ADMIN_BOOTSTRAP_PASSWORD:}
      display-name: ${ADMIN_BOOTSTRAP_DISPLAY_NAME:}
      timezone: ${ADMIN_BOOTSTRAP_TIMEZONE:}
      mfa-secret: ${ADMIN_BOOTSTRAP_MFA_SECRET:}
  scheduling:
    enabled: ${SCHEDULING_ENABLED:true}
  urls:
    frontend: ${APP_URL:http://localhost:5173}
    api: ${API_URL:http://localhost:8080/api/v1}
  security:
    jwt-secret: ${JWT_SECRET:}
    mfa-encryption-key: ${MFA_ENCRYPTION_KEY:}
    secure-cookies: ${SECURE_COOKIES:false}
    access-token-ttl: ${ACCESS_TOKEN_TTL:PT30M}
    refresh-token-ttl: ${REFRESH_TOKEN_TTL:P7D}
    password-reset-token-ttl: ${PASSWORD_RESET_TOKEN_TTL:PT30M}
  object-storage:
    provider: ${OBJECT_STORAGE_PROVIDER:memory}
    endpoint: ${OBJECT_STORAGE_ENDPOINT:http://localhost:9000}
    region: ${OBJECT_STORAGE_REGION:us-east-1}
    bucket: ${OBJECT_STORAGE_BUCKET:growth-local}
    access-key: ${OBJECT_STORAGE_ACCESS_KEY:}
    secret-key: ${OBJECT_STORAGE_SECRET_KEY:}
  ai:
    # DEEPSEEK_* are the honest names: this slot has always pointed at DeepSeek (api.deepseek.com), the
    # QWEN_* prefix was a historical misnomer. QWEN_* is kept as a fallback for shared containers and
    # local envs that have not been updated yet - see docs/05-notes.md - and is not itself deprecated
    # in a way that stops working; it is just no longer the name anything new should be written against.
    provider: ${DEEPSEEK_PROVIDER:${QWEN_PROVIDER:mock}}
    base-url: ${DEEPSEEK_BASE_URL:${QWEN_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}}
    api-key: ${DEEPSEEK_API_KEY:${QWEN_API_KEY:}}
    model: ${DEEPSEEK_MODEL:${QWEN_MODEL:qwen-plus}}
    timeout: ${DEEPSEEK_TIMEOUT:${QWEN_TIMEOUT:PT120S}}
    stream-timeout: ${DEEPSEEK_STREAM_TIMEOUT:${QWEN_STREAM_TIMEOUT:PT130S}}
    json-mode: ${DEEPSEEK_JSON_MODE:${QWEN_JSON_MODE:true}}
    # Which wire format the vendor-agnostic thinking switch (app.town.companion-model.thinking.* below)
    # gets translated into for this shared slot - see QwenHttpProvider.applyThinkingSwitch. Defaults to
    # "deepseek" because this slot has always pointed at DeepSeek in practice (docs/05-notes.md);
    # DeepSeek's own field shape is {"thinking":{"type":"enabled"|"disabled"}}, not Qwen's enable_thinking.
    thinking-style: ${DEEPSEEK_THINKING_STYLE:deepseek}
    retention-days: ${AI_RETENTION_DAYS:30}

  town:
    companion-model:
      # The companion town's second provider (qwen3.8-flash via DashScope's OpenAI-compatible endpoint).
      # Supplements the deepseek slot above rather than replacing it - see CompanionModelConfig and
      # RoutingResidentMind for how the two are chosen between per call type, with failover. Its wire
      # format for the thinking switch is fixed to "qwen" (enable_thinking) in CompanionModelConfig -
      # this bean is always DashScope/Qwen by construction, unlike the shared slot above.
      qwen3:
        base-url: ${QWEN3_BASE_URL:}
        api-key: ${QWEN3_API_KEY:}
        model: ${QWEN3_MODEL:qwen3.8-flash}
        timeout: ${QWEN3_TIMEOUT:PT60S}
        stream-timeout: ${QWEN3_STREAM_TIMEOUT:PT70S}
        json-mode: ${QWEN3_JSON_MODE:true}
      # Vendor-agnostic thinking on/off, one switch per call type, applied to whichever provider ends
      # up serving that call type (see QwenResidentMind/QwenHttpProvider - each provider translates a
      # non-null value into its own wire field). Measured, not assumed (see docs/05-notes.md): turning
      # thinking off is a large latency/token win on both deepseek and qwen3 for decision-shaped calls,
      # so that is the default. turn/summary are left at "no opinion" (unset -> provider default,
      # currently thinking-on) because dialogue/recollection are creative, in-character text and
      # whether disabling thinking there holds up on quality has not been measured yet - moving them
      # without evidence would be exactly the regression this change is meant to avoid.
      thinking:
        decision: ${COMPANION_MODEL_THINKING_DECISION:false}
        turn: ${COMPANION_MODEL_THINKING_TURN:}
        summary: ${COMPANION_MODEL_THINKING_SUMMARY:}
      # Which provider answers each call type, in try-order (first entry tried first, later entries are
      # the failover path if an earlier one throws - see RoutingResidentMind). Decisions default to
      # qwen3 first per the user's "Qwen as primary" request; deepseek is the configured fallback there
      # (and the reverse for turn/summary, which stay on deepseek first) - this is a configuration
      # choice, not a claim that deepseek cannot also turn thinking off (it can, see above).
      routes:
        decision: ${COMPANION_MODEL_ROUTE_DECISION:qwen3,deepseek}
        turn: ${COMPANION_MODEL_ROUTE_TURN:deepseek,qwen3}
        summary: ${COMPANION_MODEL_ROUTE_SUMMARY:deepseek,qwen3}
