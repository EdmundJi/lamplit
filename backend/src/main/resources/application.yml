server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: growth-backend
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:growth}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
    username: ${MYSQL_USER:growth_app}
    password: ${MYSQL_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration
  task:
    scheduling:
      # 六个 @Scheduled 任务共用调度线程池，默认只有一根线程。夜间的小镇传播 job 会
      # 调 LLM，网关慢的时候它一卡就把 outbox 发布（每 5s）和排期过期（每 60s）一起
      # 饿死。给够线程，让慢任务只慢它自己。
      pool:
        size: 4
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        boot:
          allow_jdbc_metadata_access: false
        dialect: org.hibernate.dialect.MySQLDialect

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  admin:
    local-login:
      enabled: ${LOCAL_ADMIN_LOGIN_ENABLED:false}
      username: ${LOCAL_ADMIN_LOGIN_USERNAME:}
      password: ${LOCAL_ADMIN_LOGIN_PASSWORD:}
    bootstrap:
      email: ${ADMIN_BOOTSTRAP_EMAIL:}
      password: ${ADMIN_BOOTSTRAP_PASSWORD:}
      display-name: ${ADMIN_BOOTSTRAP_DISPLAY_NAME:}
      timezone: ${ADMIN_BOOTSTRAP_TIMEZONE:}
      mfa-secret: ${ADMIN_BOOTSTRAP_MFA_SECRET:}
  scheduling:
    enabled: ${SCHEDULING_ENABLED:true}
  urls:
    frontend: ${APP_URL:http://localhost:5173}
    api: ${API_URL:http://localhost:8080/api/v1}
  security:
    jwt-secret: ${JWT_SECRET:}
    mfa-encryption-key: ${MFA_ENCRYPTION_KEY:}
    secure-cookies: ${SECURE_COOKIES:false}
    access-token-ttl: ${ACCESS_TOKEN_TTL:PT30M}
    refresh-token-ttl: ${REFRESH_TOKEN_TTL:P7D}
    password-reset-token-ttl: ${PASSWORD_RESET_TOKEN_TTL:PT30M}
  object-storage:
    provider: ${OBJECT_STORAGE_PROVIDER:memory}
    endpoint: ${OBJECT_STORAGE_ENDPOINT:http://localhost:9000}
    region: ${OBJECT_STORAGE_REGION:us-east-1}
    bucket: ${OBJECT_STORAGE_BUCKET:growth-local}
    access-key: ${OBJECT_STORAGE_ACCESS_KEY:}
    secret-key: ${OBJECT_STORAGE_SECRET_KEY:}
  ai:
    provider: ${QWEN_PROVIDER:mock}
    base-url: ${QWEN_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
    api-key: ${QWEN_API_KEY:}
    model: ${QWEN_MODEL:qwen-plus}
    timeout: ${QWEN_TIMEOUT:PT120S}
    stream-timeout: ${QWEN_STREAM_TIMEOUT:PT130S}
    json-mode: ${QWEN_JSON_MODE:true}
    retention-days: ${AI_RETENTION_DAYS:30}
