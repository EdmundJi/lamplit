server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: growth-backend
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:growth}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
    username: ${MYSQL_USER:growth_app}
    password: ${MYSQL_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration
  task:
    scheduling:
      # 六个 @Scheduled 任务共用调度线程池，默认只有一根线程。夜间的小镇传播 job 会
      # 调 LLM，网关慢的时候它一卡就把 outbox 发布（每 5s）和排期过期（每 60s）一起
      # 饿死。给够线程，让慢任务只慢它自己。
      pool:
        size: 4
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        boot:
          allow_jdbc_metadata_access: false
        dialect: org.hibernate.dialect.MySQLDialect

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  admin:
    local-login:
      enabled: ${LOCAL_ADMIN_LOGIN_ENABLED:false}
      username: ${LOCAL_ADMIN_LOGIN_USERNAME:}
      password: ${LOCAL_ADMIN_LOGIN_PASSWORD:}
    bootstrap:
      email: ${ADMIN_BOOTSTRAP_EMAIL:}
      password: ${ADMIN_BOOTSTRAP_PASSWORD:}
      display-name: ${ADMIN_BOOTSTRAP_DISPLAY_NAME:}
      timezone: ${ADMIN_BOOTSTRAP_TIMEZONE:}
      mfa-secret: ${ADMIN_BOOTSTRAP_MFA_SECRET:}
  scheduling:
    enabled: ${SCHEDULING_ENABLED:true}
  urls:
    frontend: ${APP_URL:http://localhost:5173}
    api: ${API_URL:http://localhost:8080/api/v1}
  security:
    jwt-secret: ${JWT_SECRET:}
    mfa-encryption-key: ${MFA_ENCRYPTION_KEY:}
    secure-cookies: ${SECURE_COOKIES:false}
    access-token-ttl: ${ACCESS_TOKEN_TTL:PT30M}
    refresh-token-ttl: ${REFRESH_TOKEN_TTL:P7D}
    password-reset-token-ttl: ${PASSWORD_RESET_TOKEN_TTL:PT30M}
  object-storage:
    provider: ${OBJECT_STORAGE_PROVIDER:memory}
    endpoint: ${OBJECT_STORAGE_ENDPOINT:http://localhost:9000}
    region: ${OBJECT_STORAGE_REGION:us-east-1}
    bucket: ${OBJECT_STORAGE_BUCKET:growth-local}
    access-key: ${OBJECT_STORAGE_ACCESS_KEY:}
    secret-key: ${OBJECT_STORAGE_SECRET_KEY:}
  ai:
    # Qwen3.8-Flash is the app-wide primary model. QWEN3_* remains a compatibility source for local
    # environments created while Qwen was a town-only second provider; new configuration uses QWEN_*.
    provider: ${QWEN_PROVIDER:mock}
    base-url: ${QWEN_BASE_URL:${QWEN3_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}}
    api-key: ${QWEN_API_KEY:${QWEN3_API_KEY:}}
    model: ${QWEN_MODEL:${QWEN3_MODEL:qwen3.8-flash}}
    timeout: ${QWEN_TIMEOUT:${QWEN3_TIMEOUT:PT60S}}
    stream-timeout: ${QWEN_STREAM_TIMEOUT:${QWEN3_STREAM_TIMEOUT:PT70S}}
    json-mode: ${QWEN_JSON_MODE:${QWEN3_JSON_MODE:true}}
    # Qwen's OpenAI-compatible endpoint expects enable_thinking, never DeepSeek's thinking object.
    thinking-style: ${QWEN_THINKING_STYLE:qwen}
    thinking-enabled: ${QWEN_THINKING_ENABLED:false}
    retention-days: ${AI_RETENTION_DAYS:30}

  town:
    companion-model:
      # DeepSeek is isolated to the companion fallback route. It no longer occupies app.ai, so other
      # AI features and the town's primary route both use the same real Qwen configuration above.
      deepseek:
        base-url: ${DEEPSEEK_BASE_URL:}
        api-key: ${DEEPSEEK_API_KEY:}
        model: ${DEEPSEEK_MODEL:deepseek-v4-flash}
        timeout: ${DEEPSEEK_TIMEOUT:PT120S}
        stream-timeout: ${DEEPSEEK_STREAM_TIMEOUT:PT130S}
        json-mode: ${DEEPSEEK_JSON_MODE:true}
      # Vendor-agnostic thinking switches. The Qwen primary runs all resident calls without thinking;
      # QwenHttpProvider translates false to the real enable_thinking:false request field.
      thinking:
        decision: ${COMPANION_MODEL_THINKING_DECISION:false}
        turn: ${COMPANION_MODEL_THINKING_TURN:false}
        summary: ${COMPANION_MODEL_THINKING_SUMMARY:false}
      # Which provider answers each call type, in try-order (first entry tried first, later entries are
      # the failover path if an earlier one throws - see RoutingResidentMind). Qwen3.8-Flash is the
      # primary for the resident's decisions, dialogue, and recollections. DeepSeek stays available as
      # an explicit production failure fallback; Qwen-only evaluations set a one-entry qwen route.
      routes:
        decision: ${COMPANION_MODEL_ROUTE_DECISION:qwen,deepseek}
        turn: ${COMPANION_MODEL_ROUTE_TURN:qwen,deepseek}
        summary: ${COMPANION_MODEL_ROUTE_SUMMARY:qwen,deepseek}
